# SonarCloud analysis settings, read by the `sonarcloud` job in .github/workflows/ci.yml.
# Dashboard: https://sonarcloud.io/project/overview?id=szeming23_palate
sonar.projectKey=szeming23_palate
sonar.organization=szeming23
sonar.projectName=Palate

# What to analyse. node_modules and build output stay out because only these folders are listed.
sonar.sources=backend/palate,mobile/app,mobile/components,mobile/lib
sonar.tests=backend/tests
sonar.sourceEncoding=UTF-8

# Python versions CI tests on, so rules match the syntax we actually support.
sonar.python.version=3.11,3.14
# Coverage report written by pytest-cov in the backend job.
sonar.python.coverage.reportPaths=backend/coverage.xml
# The mobile app has no unit tests yet, so it's left out of coverage (it's still scanned for bugs and
# vulnerabilities). Remove this once jest is set up for mobile/ (see TODO.md).
sonar.coverage.exclusions=mobile/**
