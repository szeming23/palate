name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-26.04 # TEMP: trial run on the new image; revert before merge
    defaults:
      run:
        working-directory: backend
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: pytest -q --cov=palate --cov-report=xml --cov-report=term
      # One copy of the coverage report is enough for SonarCloud.
      - if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: backend/coverage.xml

  mobile:
    runs-on: ubuntu-26.04 # TEMP: trial run on the new image; revert before merge
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck

  sonarcloud:
    needs: backend
    runs-on: ubuntu-26.04 # TEMP: trial run on the new image; revert before merge
    env:
      # Empty on Dependabot and fork PRs, which can't read repo secrets. The scan is skipped there.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so Sonar can tell new code from old
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: backend
      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
